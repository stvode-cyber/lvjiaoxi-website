name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（含 better-sqlite3 原生编译）
        run: npm install --omit=dev

      - name: 零依赖回归自检（--spawn 启动临时实例，不依赖外部服务）
        run: node tools/smoke-test.js --spawn

  docker:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（仅校验可构建，不推送）
        run: docker build -t lvjiaoxi-website:ci .

  ai-team-inspect:
    name: 🤖 AI 团队健康巡检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖（better-sqlite3 需要）
        run: npm install --omit=dev

      - name: 跑巡检脚本
        run: node tools/inspect-ai-team.js 2>&1 | tee /tmp/inspect.log

      - name: 检查失败项
        run: |
          echo "=== 巡检汇总 ==="
          cat /tmp/inspect.log | grep "✅ 通过:" || true
          # 排除汇总统计行（含 "通过:"/"警告:"/"失败:" 的行），只数具体失败项
          FAIL_COUNT=$(grep -E "❌" /tmp/inspect.log | grep -vE "通过:|警告:|失败:" | wc -l)
          echo ""
          echo "具体失败项数: $FAIL_COUNT"
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo ""
            echo "=== ❌ 需修复的问题 ==="
            grep -E "❌" /tmp/inspect.log | grep -vE "通过:|警告:|失败:"
            echo ""
            echo "👉 修复方法：跑 node tools/inspect-ai-team.js 看完整输出，按提示更新 Agent/Skill"
            exit 1
          else
            echo "✅ AI 团队巡检全部通过！"
          fi

      - name: 上传巡检报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-team-inspect-report
          path: /tmp/inspect.log
          retention-days: 30
