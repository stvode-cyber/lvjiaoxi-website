<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面走丢了 | 绿角犀</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a0e27" />
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('gr-theme');
        if (t !== 'light' && t !== 'dark') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="404">
  <a class="skip-link" href="#main">跳到主内容</a>

  <nav class="nav">
    <div class="brand"><img class="logo-img" src="assets/img/logo.svg" alt="绿角犀" width="30" height="30" decoding="async" /> 绿角犀</div>
    <div class="links">
      <a href="index.html" data-i18n="nav.home">首页</a>
      <a href="download.html" data-i18n="nav.download">下载</a>
    </div>
    <form class="nav-search" role="search" action="download.html" aria-label="站内搜索" data-i18n-title="nav.searchForm">
      <input id="nav-q" type="search" name="q" placeholder="搜索产品…" autocomplete="off" aria-label="搜索产品" data-i18n-ph="nav.searchPh" data-i18n-title="nav.searchInput" />
      <button type="submit" aria-label="搜索" data-i18n-title="nav.searchBtn">🔍</button>
    </form>
    <button class="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题" data-i18n-title="nav.toggleTheme">
      <span class="icon-moon" aria-hidden="true">🌙</span><span class="icon-sun" aria-hidden="true">☀️</span>
    </button>
    <div class="lang-select"></div>
  </nav>

  <main id="main" tabindex="-1" class="container" style="text-align:center; padding:110px 24px 150px;">
    <div class="err-code">404</div>
    <h1 style="margin:6px 0 14px;">这个页面走丢了</h1>
    <p style="color:var(--text-dim); max-width:420px; margin:0 auto 24px;">
      你访问的链接可能已失效，或从未存在。不如回到首页，看看我们的应用与游戏。
    </p>
    <a href="index.html" class="btn btn-primary" style="display:inline-flex; padding:12px 28px; margin-bottom:26px;" data-i18n="btn.backHome">返回首页</a>

    <p class="err-sec-title" data-i18n="err.quickNav">快捷导航</p>
    <nav class="err-links" aria-label="快捷导航">
      <a href="index.html" data-i18n="nav.home">首页</a>
      <a href="download.html" data-i18n="nav.download">下载</a>
      <a href="contact.html" data-i18n="nav.contact">联系我们</a>
      <a href="api.html" data-i18n="nav.api">API 文档</a>
    </nav>

    <div class="err-search">
      <label class="err-sec-title" for="err-search" data-i18n="err.search">站内搜索</label>
      <input id="err-search" type="search" placeholder="输入产品名称搜索…" data-i18n-ph="err.searchPh" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="err-results" aria-activedescendant="" />
      <div id="err-results" class="err-results" role="listbox"></div>
      <div id="err-live" class="visually-hidden" aria-live="polite"></div>
    </div>
  </main>

  <style>
    .err-code {
      font-size: 104px; font-weight: 800; line-height: 1;
      background: var(--primary-grad);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }
  </style>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/err-search.js"></script>
</body>
</html>
