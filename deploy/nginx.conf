# 绿角犀官网 · Nginx 反向代理 + TLS 配置
# 用法（以 Ubuntu/Debian 为例）：
#   1) 证书：sudo certbot --nginx -d lvjiaoxi.com -d www.lvjiaoxi.com（canonical 为 lvjiaoxi.com）
#   2) 将本文件内容并入 /etc/nginx/sites-available/lvjiaoxi 并软链到 sites-enabled
#   3) sudo nginx -t && sudo systemctl reload nginx
# 说明：应用本身已启用 gzip 与全套安全响应头，此处仅做 TLS 终结 +
#       反向代理 + 一层响应头加固；无需在 nginx 再开 gzip（避免重复压缩）。

server {
    listen 80;
    server_name www.lvjiaoxi.com lvjiaoxi.com;
    # 80 端口统一跳转到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.lvjiaoxi.com lvjiaoxi.com;

    ssl_certificate     /etc/letsencrypt/live/lvjiaoxi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lvjiaoxi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头加固（应用已设，这里再叠加一层保证）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 限制请求体大小（联系表单/上传等），按需调整
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
